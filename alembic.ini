# Alembic config. The database URL is NOT here — migrations/env.py reads DATABASE_URL
# from the environment, so the same file works for the migrate container, a shell on
# the VPS and a laptop pointed at a local Postgres, with nothing to keep in sync and
# no credentials in the repo.

[alembic]
script_location = migrations

# Revisions are numbered and named, not hashed — the committed history reads
# 0001_users, 0002_chatkit_store, 0003_tariff, ... and the revision id IS that string,
# so the filename is just the id. Always pass --rev-id; an autogenerated hash would
# break the ordering you can see in `ls`:
#     alembic revision --rev-id 0006_answer_feedback -m "answer feedback"
file_template = %%(rev)s

# Lets a migration `import app.…` if it ever needs a constant. Nothing does today —
# migrations must stay readable as standalone SQL history.
prepend_sys_path = .

# Naive UTC timestamps in the generated header. The whole app is TZ=UTC.
timezone = UTC

# sqlalchemy.url is intentionally absent. env.py builds it from DATABASE_URL and hands
# it straight to create_engine(); setting it here would also mean every `%` in a
# generated password had to be escaped, which is a great way to lose an afternoon.

# Keep generated revisions ruff-clean (line-length 100). Migrations are only ever
# CREATED on a dev machine, where the dev dependency group provides ruff.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
