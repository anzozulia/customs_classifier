# classifier.anzozulia.com — the UKTZED classifier, proxied by the host's existing nginx.
#
# This box already serves seven sites and owns :80 and :443, so the stack ships NO reverse
# proxy of its own (see the note at the top of docker-compose.prod.yml). The app listens on
# 127.0.0.1:8090 and this vhost is the only thing that can reach it.
#
# Modelled on airlineaisupport.conf, which already proxies ChatKit successfully on this host.
#
# Install once, by hand:
#   scp deploy/nginx/classifier.anzozulia.com.conf \
#       root@116.203.136.84:/etc/nginx/sites-available/classifier.conf
#   ssh root@116.203.136.84 'ln -sf /etc/nginx/sites-available/classifier.conf \
#       /etc/nginx/sites-enabled/classifier.conf && nginx -t && systemctl reload nginx'
# `nginx -t` BEFORE the reload is what keeps a typo here from taking the other sites down.

upstream uktzed_upstream {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name classifier.anzozulia.com;

    # certbot's webroot challenge, same path the other vhosts on this box use.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` and NOT the `http2 on;` directive: this host runs nginx 1.24.0 and
    # the standalone directive only exists from 1.25.1. The other vhosts on the box use this
    # same inline form. `nginx -t` rejects the newer syntax outright, which is why the test
    # runs before every reload here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name classifier.anzozulia.com;

    ssl_certificate     /etc/letsencrypt/live/classifier.anzozulia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classifier.anzozulia.com/privkey.pem;

    # The tariff JSON is 2.4 MB but is never uploaded; requests here are chat messages.
    client_max_body_size 4m;

    # Content-Security-Policy. ChatKit is NOT self-hostable: the widget loads from
    # cdn.platform.openai.com and the frame calls api.openai.com to verify the domain key.
    # Omit either source and the chat silently fails to mount, with nothing in the server log.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.platform.openai.com; frame-src https://cdn.platform.openai.com; connect-src 'self' https://api.openai.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://uktzed_upstream;
        proxy_http_version 1.1;

        # THE SSE SETTINGS. A classification streams for 30-60 seconds and its first event
        # arrives in ~60 ms. With buffering on, nginx holds the whole stream and the user
        # stares at nothing until the turn ends — which is the single worst failure mode this
        # app was rebuilt to avoid. `proxy_read_timeout` must exceed the longest turn; the
        # measured p99 is ~140 s, and the app's own wall-clock budget cuts a turn at 180 s.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # X-Forwarded-Proto is load-bearing: the app derives is_production from it, which
        # decides Secure cookies. Host must be passed through unchanged or every POST fails
        # the same-origin check against PUBLIC_BASE_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
