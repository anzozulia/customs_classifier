[project]
name = "uktzed-v2"
version = "0.1.0"
description = "UKTZED product classifier — web chat, OpenAI Agents SDK + ChatKit"
requires-python = ">=3.13"

dependencies = [
  # ChatKit backend SDK. NOT on PyPI — the `chatkit` name there is a reserved 0.0.1 stub.
  # Pinned to a tag; it declares openai-agents>=0.3.2 itself.
  "openai-chatkit @ git+https://github.com/openai/chatkit-python.git@v1.6.5",
  "openai-agents==0.22.2",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",              # SYNC driver for alembic only; runtime is asyncpg
  "sqlalchemy==2.0.54",            # alembic's migration DDL only; runtime queries are asyncpg
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "itsdangerous==2.2.0",           # SessionMiddleware cookie signing
  "argon2-cffi==25.1.0",
  "typer==0.27.2",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[dependency-groups]
# pyyaml: the eval golden set is YAML. It is already installed in the venv, but nothing
# declares it (`pip show pyyaml` reports an empty Required-by), so it is a transitive
# accident that a clean install would drop. Declared here, not in `dependencies` — the
# runtime app never reads YAML.
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff>=0.14.5",
  "pyright>=1.1.407",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Flat layout with sibling dirs (web/, data/, evals/, migrations/) — tell setuptools
# that only `app` is the importable package, or discovery refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
# Ukrainian UI text is pervasive. Without this, ruff RUF001/RUF002 flags Cyrillic letters
# that look like ASCII in every file that carries user-facing copy.
allowed-confusables = ["і", "а", "у", "о", "б", "е", "с", "р", "х", "–", "«", "»",
                       "Н", "І", "А", "О", "В", "Е", "С", "Р", "Х", "К", "М", "Т",
                       "З", "У", "Д", "Г", "П", "Б", "Ч", "Я", "Ю", "Ц", "Ш", "Ж",
                       "\u203a", "\u2039", "\u2019"]   # › ‹ as breadcrumb separators

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# ---------------------------------------------------------------------------- coverage
# Defaults for `pytest --cov`, so the flag set is short and CI and a laptop measure the
# SAME thing. CI runs the gate:
#
#     pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
#
# Deliberately NOT added to `[tool.pytest.ini_options] addopts`: coverage roughly doubles
# the runtime of a 4-second suite, and the inner edit-test loop is run far more often than
# CI is. CI passes the flags explicitly instead.
#
# pytest-cov itself is not declared in the `dev` group (it is installed in the local venv
# but nothing requires it), so `.github/workflows/ci.yml` names it in the test job. Move it
# into `[dependency-groups] dev` the next time that list is touched and drop it from there.
[tool.coverage.run]
source = ["app"]
# Repo-relative paths in coverage.xml. Without this the uploaded artifact carries the
# runner's absolute /home/runner/work/... paths and does not line up with the repo.
relative_files = true
# Statement coverage, not branch coverage. The 80% gate below was baselined against
# statements; switching this to `true` adds every untaken branch to the denominator and
# drops the measured number several points with no change to the code, so it cannot be
# flipped without re-baselining --cov-fail-under at the same time.
branch = false

[tool.coverage.report]
show_missing = true
# Nothing is omitted. Every module under app/ ships in the runtime image, including
# app/cli.py — which is the only way a user or a tariff dataset comes into existence, so
# excusing it from measurement would hide the largest untested surface in the project.
omit = []
precision = 1
exclude_also = [
  # Import-time only, erased at runtime by `from __future__ import annotations`.
  "if TYPE_CHECKING:",
  # `python -m app.cli` enters through typer, never through this guard.
  "if __name__ == .__main__.:",
]
